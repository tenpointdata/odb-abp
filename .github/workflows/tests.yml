# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ develop, 3.2.x]
  pull_request:
    branches: [ develop, 3.2.x ]
  workflow_dispatch:
  schedule:
    - cron: 0 5 * * 1

permissions:
  contents: read

# A new push supersedes the run in progress for the same branch or pull request (superseded
# develop runs used to be cancelled by hand).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Read by Maven 3.9+: batch mode, no download progress in the logs.
  # A failed test is re-run once: about 60% of failed runs were flaky tests that passed on a manual
  # re-run. Tests that pass only on the re-run are still listed in the job summary.
  MAVEN_ARGS: -B -ntp -Dsurefire.rerunFailingTestsCount=1

jobs:
  build:

    runs-on: ubuntu-latest
    # successful runs take 15-90 minutes, a hung test should not hold a runner for 6 hours
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # LTS releases; 17, the minimum supported release, is covered by distribution
        java-version: ['21', '25']
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up JDK ${{matrix.java-version}}
      uses: actions/setup-java@v6
      with:
        java-version: ${{matrix.java-version}}
        distribution: 'temurin'
        # Step that does that actual cache save and restore
    - name: Cache
      uses: actions/cache@v6
      with:
       path: ~/.m2/repository
       key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
       restore-keys: |
        ${{ runner.os }}-maven-
    - name: Build with Maven
      run: mvn package --file pom.xml
    - name: List flaky tests
      if: always()
      shell: python3 {0}
      run: |
        import glob, os, xml.etree.ElementTree as ET
        flaky = set()
        for report in glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True):
            for case in ET.parse(report).getroot().iter("testcase"):
                if case.find("flakyFailure") is not None or case.find("flakyError") is not None:
                    flaky.add(case.get("classname") + "." + case.get("name"))
        if flaky:
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                summary.write("### Flaky tests (failed, then passed when re-run)\n\n")
                summary.writelines("- `%s`\n" % test for test in sorted(flaky))
    - name: Keep test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports-java-${{matrix.java-version}}
        path: '**/target/surefire-reports/'
        retention-days: 14

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17']
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up JDK ${{matrix.java-version}}
      uses: actions/setup-java@v6
      with:
        java-version: ${{matrix.java-version}}
        distribution: 'temurin'
        # Step that does that actual cache save and restore
    - name: Cache
      uses: actions/cache@v6
      with:
       path: ~/.m2/repository
       key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
       restore-keys: |
        ${{ runner.os }}-maven-
    - name: Build with Maven
      run: mvn package -P all --file pom.xml
    - name: Record distribution provenance
      shell: bash
      run: |
        set -euo pipefail
        cd packages/community/target
        shopt -s nullglob
        tarballs=(orientdb-community-*.tar.gz)
        zips=(orientdb-community-*.zip)
        if [[ ${#tarballs[@]} -ne 1 || ${#zips[@]} -ne 1 ]]; then
          echo 'Expected one Community tarball and one zip' >&2
          exit 1
        fi
        shasum -a 256 -- "${tarballs[0]}" "${zips[0]}" > SHA256SUMS
        printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
    - name: Upload tested Community distribution
      uses: actions/upload-artifact@v7
      with:
        name: orientdb-community-${{ github.sha }}
        path: |
          packages/community/target/orientdb-community-*.tar.gz
          packages/community/target/orientdb-community-*.zip
          packages/community/target/SHA256SUMS
          packages/community/target/SOURCE_COMMIT
        if-no-files-found: error
        retention-days: 14
    - name: List flaky tests
      if: always()
      shell: python3 {0}
      run: |
        import glob, os, xml.etree.ElementTree as ET
        flaky = set()
        for report in glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True):
            for case in ET.parse(report).getroot().iter("testcase"):
                if case.find("flakyFailure") is not None or case.find("flakyError") is not None:
                    flaky.add(case.get("classname") + "." + case.get("name"))
        if flaky:
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                summary.write("### Flaky tests (failed, then passed when re-run)\n\n")
                summary.writelines("- `%s`\n" % test for test in sorted(flaky))
    - name: Keep test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports-java-${{matrix.java-version}}-all
        path: '**/target/surefire-reports/'
        retention-days: 14
