# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ develop, 3.2.x]
  pull_request:
    branches: [ develop, 3.2.x ]
  workflow_dispatch:
  schedule:
    - cron: 0 5 * * 1

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '24', '25']
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up JDK ${{matrix.java-version}} PR
      uses: actions/setup-java@v6
      with:
        java-version: ${{matrix.java-version}}
        distribution: 'temurin'
        # Step that does that actual cache save and restore
    - name: Cache 
      uses: actions/cache@v6
      with:
       path: ~/.m2/repository
       key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
       restore-keys: |
        ${{ runner.os }}-maven-
    - name: Build with Maven
      run: mvn -B package --file pom.xml

  distribution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17']
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up JDK ${{matrix.java-version}}
      uses: actions/setup-java@v6
      with:
        java-version: ${{matrix.java-version}}
        distribution: 'temurin'
        # Step that does that actual cache save and restore
    - name: Cache
      uses: actions/cache@v6
      with:
       path: ~/.m2/repository
       key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
       restore-keys: |
        ${{ runner.os }}-maven-
    - name: Build with Maven
      run: mvn -B package -P all --file pom.xml
    - name: Record distribution provenance
      shell: bash
      run: |
        set -euo pipefail
        cd packages/community/target
        shopt -s nullglob
        tarballs=(orientdb-community-*.tar.gz)
        zips=(orientdb-community-*.zip)
        if [[ ${#tarballs[@]} -ne 1 || ${#zips[@]} -ne 1 ]]; then
          echo 'Expected one Community tarball and one zip' >&2
          exit 1
        fi
        shasum -a 256 -- "${tarballs[0]}" "${zips[0]}" > SHA256SUMS
        printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
    - name: Upload tested Community distribution
      uses: actions/upload-artifact@v7
      with:
        name: orientdb-community-${{ github.sha }}
        path: |
          packages/community/target/orientdb-community-*.tar.gz
          packages/community/target/orientdb-community-*.zip
          packages/community/target/SHA256SUMS
          packages/community/target/SOURCE_COMMIT
        if-no-files-found: error
        retention-days: 14
